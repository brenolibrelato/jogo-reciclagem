# Porta em que o servidor escuta. O Render (e a maioria dos hosts gratuitos) injeta
# a variavel de ambiente PORT automaticamente; em desenvolvimento local usa 8080.
server.port=${PORT:8080}

# Origem(ns) permitida(s) para chamadas a API (separadas por virgula, sem espaco extra).
# Em producao, sobrescreva com a variavel de ambiente APP_CORS_ALLOWED_ORIGINS
# apontando para o dominio real do jogo (ex: https://seu-jogo.onrender.com).
app.cors.allowed-origins=http://localhost:8080

# Tempo de inatividade (minutos) ate uma sessao de jogo abandonada ser removida da memoria.
app.sessao.timeout-minutos=15

# Limite de requisicoes por IP nos endpoints da API, dentro da janela de tempo configurada.
app.ratelimit.max-requisicoes=60
app.ratelimit.janela-segundos=60
